<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SwapWear</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="logo">Swap<span>Wear</span></a>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="listings.html">Explore</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <!-- Registration Form -->
    <div class="form-container">

        <h2>Create Your Account 🧥</h2>

        <form id="registerForm">

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Location</label>
                <input
                    type="text"
                    id="location"
                    placeholder="Enter your city"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <button type="submit" class="btn">Create Account</button>

            <p style="text-align:center; margin-top:20px;">
                Already have an account?
                <a href="login.html" style="color:#1f6f54; font-weight:bold;">
                    Login Here
                </a>
            </p>

        </form>

    </div>

    <footer>
        <p>© 2026 SwapWear | Sustainable Clothing Exchange Marketplace</p>
    </footer>

    <script src="JS/main.js"></script>

</body>
</html>
