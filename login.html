<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SwapWear</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="logo">Swap<span>Wear</span></a>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="listings.html">Explore</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>

    <!-- Login Form -->
    <div class="form-container">

        <h2>Welcome Back 👋</h2>

        <form id="loginForm">

            <div class="form-group">
                <label>Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn">Login</button>

            <p style="text-align:center; margin-top:20px;">
                Don't have an account?
                <a href="register.html" style="color:#1f6f54; font-weight:bold;">
                    Register Now
                </a>
            </p>

        </form>

    </div>

    <footer>
        <p>© 2026 SwapWear | Sustainable Clothing Exchange Marketplace</p>
    </footer>

    <script src="js/main.js"></script>

</body>
</html>
