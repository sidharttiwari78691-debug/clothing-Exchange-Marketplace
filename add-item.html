<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>List an Item - SwapWear</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <a href="index.html" class="logo">
            Swap<span>Wear</span>
        </a>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="listings.html">Explore</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>

    </nav>


    <!-- Add Item Form -->
    <section class="section">

        <div class="add-item-container">

            <h1 class="section-title">
                List Your Clothing Item 👕
            </h1>

            <p class="form-description">
                Add the details of an item you want to exchange.
            </p>


            <form id="addItemForm">

                <!-- Clothing Name -->
                <div class="form-group">

                    <label for="itemName">
                        Clothing Name
                    </label>

                    <input
                        type="text"
                        id="itemName"
                        placeholder="Example: Blue Denim Jacket"
                        required
                    >

                </div>


                <!-- Image -->
                <div class="form-group">

                    <label for="itemImage">
                        Clothing Image
                    </label>

                    <input
                        type="file"
                        id="itemImage"
                        accept="image/*"
                    >

                    <small>
                        Upload a clear image of your clothing item.
                    </small>

                </div>


                <!-- Category -->
                <div class="form-group">

                    <label for="itemCategory">
                        Category
                    </label>

                    <select id="itemCategory" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="shirt">
                            Shirt
                        </option>

                        <option value="jacket">
                            Jacket
                        </option>

                        <option value="hoodie">
                            Hoodie
                        </option>

                        <option value="jeans">
                            Jeans
                        </option>

                        <option value="shoes">
                            Shoes
                        </option>

                        <option value="dress">
                            Dress
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Brand -->
                <div class="form-group">

                    <label for="itemBrand">
                        Brand
                    </label>

                    <input
                        type="text"
                        id="itemBrand"
                        placeholder="Example: Levi's"
                        required
                    >

                </div>


                <!-- Size -->
                <div class="form-group">

                    <label for="itemSize">
                        Size
                    </label>

                    <input
                        type="text"
                        id="itemSize"
                        placeholder="Example: M / L / 32 / UK 8"
                        required
                    >

                </div>


                <!-- Condition -->
                <div class="form-group">

                    <label for="itemCondition">
                        Condition
                    </label>

                    <select id="itemCondition" required>

                        <option value="">
                            Select Condition
                        </option>

                        <option value="New">
                            New
                        </option>

                        <option value="Like New">
                            Like New
                        </option>

                        <option value="Excellent">
                            Excellent
                        </option>

                        <option value="Good">
                            Good
                        </option>

                        <option value="Fair">
                            Fair
                        </option>

                    </select>

                </div>


                <!-- Estimated Value -->
                <div class="form-group">

                    <label for="itemValue">
                        Estimated Swap Value (₹)
                    </label>

                    <input
                        type="number"
                        id="itemValue"
                        min="0"
                        placeholder="Example: 1500"
                        required
                    >

                </div>


                <!-- Location -->
                <div class="form-group">

                    <label for="itemLocation">
                        Location
                    </label>

                    <input
                        type="text"
                        id="itemLocation"
                        placeholder="Example: Lucknow"
                        required
                    >

                </div>


                <!-- Description -->
                <div class="form-group">

                    <label for="itemDescription">
                        Description
                    </label>

                    <textarea
                        id="itemDescription"
                        rows="5"
                        placeholder="Describe the clothing item, condition, usage, etc."
                        required
                    ></textarea>

                </div>


                <!-- Submit -->
                <button type="submit" class="btn">
                    Publish Listing 🚀
                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 SwapWear | Sustainable Clothing Exchange Marketplace
        </p>

    </footer>


    <script src="JS/main.js"></script>

</body>
</html>
